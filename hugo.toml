######################## default configuration ####################
# The base URL of your site (required). This will be prepended to all relative URLs.
baseURL = "https://securetechie.com/"
# Title of your website (required).
title = "Secure Techies | Managed IT & Cybersecurity in Southern California"
# Your theme name
theme = "hugoplate"
# Default time zone for time stamps; use any valid tz database name: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
timeZone = "America/Los_Angeles"
# post excerpt
summaryLength = 10 # see https://gohugo.io/content-management/summaries/#automatic-summary
# disable language
disableLanguages = [
] # example: ["fr"] for disable french language. see https://gohugo.io/content-management/multilingual/
hasCJKLanguage = false #  If hasCJKLanguage true, auto-detect Chinese/Japanese/Korean Languages in the content. see: https://gohugo.io/getting-started/configuration/#hascjklanguage
# default language
defaultContentLanguage = 'en'
# defaultContentLanguageInSubdir need to be true if you want to use the language code as a subdirectory and language specific 404 page
defaultContentLanguageInSubdir = false

########################### Services #############################
[services]
[services.googleAnalytics]
ID = 'G-441E3KPEEL'

[services.disqus]
shortname = '' # Disabled — set your Disqus shortname here if needed

########################## Permalinks ############################
[permalinks.page]
"pages" = "/:slugorcontentbasename/"


########################## Pagination ############################
[pagination]
disableAliases = false
pagerSize = 10
path = 'page'


############################# Sitemap #############################
[sitemap]
changefreq = 'weekly'
priority = 0.5
filename = 'sitemap.xml'

############################# Build ##############################
[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

############################# Modules ############################
[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'


############################# Outputs ############################
[outputs]
home = ["HTML", "RSS", "WebAppManifest", "SearchIndex"]

############################# Imaging ############################
[imaging]
# See https://github.com/disintegration/imaging
# Default JPEG or WebP quality setting. Default is 75.
quality = 80
resampleFilter = "Lanczos"

############################ Caches ##############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"


############################ Markup ##############################
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'monokai' # see https://xyproto.github.io/splash/docs/all.html
lineNumbersInTable = false

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true


########################### Media types ###########################
[mediaTypes]
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]


########################### Output Format ##########################
[outputFormats]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"

[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "searchindex"
isPlainText = true
notAlternative = true


############################# Plugins ##############################

# CSS Plugins
# NOTE: swiper + glightbox CSS removed — the gallery-slider module (the only
# consumer of Swiper/GLightbox) is not used by any page or content on this
# site, so these were ~unused CSS shipped in the lazy bundle. Removing them
# trims the "Reduce unused CSS" weight with zero visual change.
#
# NOTE: Font Awesome CSS (brands.css / solid.css / icons.css / fa-display-swap.css)
# removed entirely. Every icon on the site is now rendered as an inline SVG,
# so no page loads the ~30 KB FA icon CSS or the 277 KB FA webfonts. This is
# the single biggest "Reduce unused CSS" + LCP win and is visually identical.

# JS Plugins
[[params.plugins.js]]
link = "js/search.js" # https://github.com/gethugothemes/hugo-modules/tree/master/search
lazy = false
# NOTE: swiper-bundle.js, glightbox.js and gallery-slider.js removed — the
# gallery-slider module is unused sitewide (no page/content uses Swiper or
# galleries), and the project's main.js does not call `new Swiper()`. Swiper
# was ~30 KB of the always-loaded main bundle and was the single largest chunk
# of "Reduce unused JavaScript". Removing it is behaviourally identical.
[[params.plugins.js]]
link = "plugins/cookie.js" # https://github.com/gethugothemes/hugo-modules/tree/master/components/cookie-consent
lazy = false
[[params.plugins.js]]
link = "js/accordion.js" # https://github.com/gethugothemes/hugo-modules/tree/master/accordion
lazy = true
[[params.plugins.js]] 
link = "js/tab.js" # https://github.com/gethugothemes/hugo-modules/tree/master/accordion
lazy = true
[[params.plugins.js]]
link = "js/modal.js" # https://github.com/gethugothemes/hugo-modules/tree/master/modal
lazy = true
[[params.plugins.js]]
link = "plugins/youtube-lite.js" # https://github.com/gethugothemes/hugo-modules/tree/master/videos
lazy = true
