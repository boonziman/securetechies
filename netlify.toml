[build]
publish = "public"
command = "npm run project-setup && node scripts/themeGenerator.js && hugo --gc --minify --baseURL ${URL}/ && cp static/2b5b8549d5b1e1d4ba36838fd63ec07c.txt public/2b5b8549d5b1e1d4ba36838fd63ec07c.txt && node scripts/indexnow-ping.js"

[build.environment]
HUGO_VERSION = "0.157.0"
GO_VERSION = "1.25.1"
NODE_VERSION = "20"

[context.production.environment]
HUGO_ENV = "production"

[context.deploy-preview]
command = "npm run project-setup && node scripts/themeGenerator.js && hugo --gc --minify --baseURL ${DEPLOY_PRIME_URL}/"

# Security & caching headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
# Durable global edge cache (Netlify CDN-only directive — does NOT affect the
# browser Cache-Control, so page content still updates instantly on every deploy
# because Netlify auto-purges the durable cache on each atomic deploy).
# Why: this matters for pretty URLs (/, /locations/<city>/, the landing pages)
# which DON'T end in ".html", so the "*.html" rule below never matched them and
# they had no edge-persistence hint. Without this, the FIRST visitor to hit a
# given Netlify edge location (a "cold" POP) waited on a slow origin fetch —
# that cold time-to-first-byte is exactly what PageSpeed Insights measures (one
# cold request) and is what was capping the mobile score in the high 80s. With
# "durable", every edge worldwide keeps the page in a persistent cache, so even
# a first-time POP serves it instantly. Real users already saw the fast (warm)
# path; this makes the cold/PSI path fast too.
Netlify-CDN-Cache-Control = "public, durable, s-maxage=31536000, stale-while-revalidate=60"

# Cache static assets aggressively (images, fonts, CSS, JS)
[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.webp"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.woff2"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# HTML pages — short cache so updates propagate quickly
[[headers]]
for = "*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# Redirect www to non-www (primary domain)
[[redirects]]
from = "https://www.securetechie.com/*"
to = "https://securetechie.com/:splat"
status = 301
force = true

