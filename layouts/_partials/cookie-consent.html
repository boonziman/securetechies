<!-- cookie -->
{{/* Project override of the vendored cookie-consent partial.
     Uses native document.cookie (no js-cookie dependency).
     Supports three consent levels: all, essential, rejected. */}}
{{ with site.Params.cookies }}
  {{ if .enable }}
    <div id="cookie-box" class="cookie-box cookie-box-hide" role="dialog" aria-label="Cookie consent" aria-live="polite">
      <div class="cookie-box-content">{{ .content | markdownify }}</div>
      <div class="cookie-box-actions">
        <button id="cookie-accept-all" class="cookie-box-button btn btn-sm btn-primary" type="button">
          {{ .button_accept_all | default "Accept All" }}
        </button>
        <button id="cookie-accept-essential" class="cookie-box-button btn btn-sm btn-outline-primary" type="button">
          {{ .button_essential | default "Essential Only" }}
        </button>
        <button id="cookie-reject" class="cookie-box-button btn btn-sm btn-outline-secondary" type="button">
          {{ .button_reject | default "Reject" }}
        </button>
      </div>
    </div>

    <script type="application/javascript">
      (function () {
        var cookieBox = document.getElementById('cookie-box');
        var acceptAllBtn = document.getElementById('cookie-accept-all');
        var essentialBtn = document.getElementById('cookie-accept-essential');
        var rejectBtn = document.getElementById('cookie-reject');
        if (!cookieBox || !acceptAllBtn || !essentialBtn || !rejectBtn) return;

        var maxAge = {{ .expire_days }} * 24 * 60 * 60;

        function getConsent() {
          var match = document.cookie.match(/(?:^|;\s*)cookie-consent=([^;]+)/);
          return match ? decodeURIComponent(match[1]) : null;
        }

        function setConsent(level) {
          document.cookie = 'cookie-consent=' + encodeURIComponent(level) + '; max-age=' + maxAge + '; path=/; SameSite=Lax';
          cookieBox.classList.add('cookie-box-hide');
          window.dispatchEvent(new CustomEvent('cookie-consent-changed', { detail: { level: level } }));
        }

        if (!getConsent()) {
          cookieBox.classList.remove('cookie-box-hide');
          acceptAllBtn.onclick = function () { setConsent('all'); };
          essentialBtn.onclick = function () { setConsent('essential'); };
          rejectBtn.onclick = function () { setConsent('rejected'); };
        }
      })();
    </script>

    <style>
      .cookie-box {
        position: fixed;
        left: 2rem;
        bottom: 2rem;
        z-index: 9999;
        padding: 1.5rem;
        background-color: #fff;
        max-width: calc(100% - 4rem);
        width: 28rem;
        box-shadow: 1px 0px 10px 7px rgba(154, 154, 154, 0.11);
        border-radius: 12px;
      }
      .cookie-box-hide {
        display: none;
      }
      .cookie-box-content {
        font-size: 0.92rem;
        line-height: 1.55;
        color: #334155;
      }
      .cookie-box-content p {
        margin: 0;
      }
      .cookie-box-actions {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .cookie-box-button {
        display: block;
        width: 100%;
        margin-top: 0;
      }
      .dark .cookie-box {
        background-color: #222;
      }
      .dark .cookie-box-content {
        color: #cbd5e1;
      }
      @media (max-width: 480px) {
        .cookie-box {
          left: 1rem;
          right: 1rem;
          bottom: 1rem;
          width: auto;
          max-width: none;
        }
      }
    </style>
  {{ end }}
{{ end }}
