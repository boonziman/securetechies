{{- /* Distinct line icons for the CCTV "What's On Board" feature grid. Index passed as context. */ -}}
{{- $i := . -}}
<svg class="st-fico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{{- if eq $i 0 -}}
  {{/* HD night-vision camera */}}
  <rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10l5-2v8l-5-2"/><circle cx="9.5" cy="12" r="2.4"/>
{{- else if eq $i 1 -}}
  {{/* 360 / PTZ */}}
  <circle cx="12" cy="12" r="3"/><path d="M12 3a9 9 0 0 1 9 9M12 21a9 9 0 0 1-9-9"/><path d="M19 5l2-2v4M5 19l-2 2v-4"/>
{{- else if eq $i 2 -}}
  {{/* AI chip */}}
  <rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 4v3M14 4v3M10 17v3M14 17v3M4 10h3M4 14h3M17 10h3M17 14h3"/><circle cx="12" cy="12" r="1.6"/>
{{- else if eq $i 3 -}}
  {{/* two-way audio / speaker */}}
  <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a3.5 3.5 0 0 1 0 6M18.5 7a6.5 6.5 0 0 1 0 10"/>
{{- else if eq $i 4 -}}
  {{/* real-time alert bell */}}
  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
{{- else if eq $i 5 -}}
  {{/* solar + battery */}}
  <rect x="3" y="4" width="18" height="9" rx="1.5"/><path d="M9 4v9M15 4v9M3 8.5h18"/><path d="M8 17h8M10 17v3M14 17v3"/>
{{- else if eq $i 6 -}}
  {{/* cloud + local storage */}}
  <path d="M7 16a4 4 0 0 1 .9-7.9 5 5 0 0 1 9.6 1.4A3.5 3.5 0 0 1 17 16H7z"/><path d="M9 19h6M12 16v3"/>
{{- else if eq $i 7 -}}
  {{/* weather-resistant shield */}}
  <path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/>
{{- else -}}
  <path d="M5 13l4 4L19 7"/>
{{- end -}}
</svg>
