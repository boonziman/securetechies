<a class="st-tool-card" href="{{ .RelPermalink }}">
  <div class="st-tool-card-accent" aria-hidden="true"></div>
  <div class="st-tool-card-top">
    <div class="st-tool-card-icon" aria-hidden="true">
      {{ partial "tools/icon.html" .Params.tool_icon }}
    </div>
    {{ with .Params.tool_badge }}<span class="st-tool-card-tag">{{ . }}</span>{{ end }}
  </div>
  <h2 class="st-tool-card-title">{{ .Title }}</h2>
  <p class="st-tool-card-desc">{{ .Params.tool_summary | default .Params.description }}</p>
  <span class="st-tool-card-cta">
    Open tool
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
  </span>
</a>
