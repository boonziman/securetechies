{{- /* Animated line-art icons for the "Measuring Success" challenge tabs. */ -}}
{{- $k := . -}}
<svg class="st-sico" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{{- if eq $k "theft" -}}
  <path class="st-sico-p" d="M6 13 L16 6 L26 13 V26 H6 Z"/>
  <path class="st-sico-p" d="M12 26 V17 H20 V26"/>
  <path class="st-sico-p" d="M9 11 L23 21" stroke="#ef6a6a"/>
{{- else if eq $k "perimeter" -}}
  <rect class="st-sico-p" x="5" y="5" width="22" height="22" rx="2"/>
  <path class="st-sico-p" d="M5 11 H27 M11 5 V27"/>
  <circle class="st-sico-p" cx="19" cy="19" r="3.2"/>
{{- else if eq $k "parking" -}}
  <rect class="st-sico-p" x="6" y="6" width="20" height="20" rx="3"/>
  <path class="st-sico-p" d="M12 22 V10 H17.5 A3.5 3.5 0 0 1 17.5 17 H12"/>
{{- else if eq $k "shrink" -}}
  <path class="st-sico-p" d="M6 11 H26 L24 25 H8 Z"/>
  <path class="st-sico-p" d="M6 11 L9 6 H23 L26 11"/>
  <path class="st-sico-p" d="M13 16 L19 16"/>
{{- else if eq $k "trespass" -}}
  <circle class="st-sico-p" cx="16" cy="9" r="3"/>
  <path class="st-sico-p" d="M11 26 C11 19 21 19 21 26"/>
  <path class="st-sico-p" d="M24 9 L29 14 M29 9 L24 14" stroke="#ef6a6a"/>
{{- else if eq $k "violent" -}}
  <path class="st-sico-p" d="M16 27 C8 22 5 17 5 11 A5 5 0 0 1 16 9 A5 5 0 0 1 27 11 C27 17 24 22 16 27 Z"/>
  <path class="st-sico-p" d="M16 13 L13 18 H18 L15 23"/>
{{- else if eq $k "asset" -}}
  <path class="st-sico-p" d="M16 5 L26 9 V16 C26 22 21 26 16 28 C11 26 6 22 6 16 V9 Z"/>
  <path class="st-sico-p" d="M11 16 L15 20 L22 12"/>
{{- else if eq $k "people" -}}
  <circle class="st-sico-p" cx="11" cy="11" r="3"/>
  <circle class="st-sico-p" cx="21" cy="11" r="3"/>
  <path class="st-sico-p" d="M5 25 C5 18 13 18 13 25 M19 25 C19 18 27 18 27 25"/>
{{- else if eq $k "dumping" -}}
  <path class="st-sico-p" d="M8 12 H24 L22 26 H10 Z"/>
  <path class="st-sico-p" d="M6 12 H26 M13 9 H19 V12"/>
  <path class="st-sico-p" d="M14 16 V22 M18 16 V22"/>
{{- else -}}
  <circle class="st-sico-p" cx="16" cy="16" r="10"/>
  <path class="st-sico-p" d="M16 11 V16 L19 19"/>
{{- end -}}
</svg>
