{{ define "main" }}

<!-- PAGE HERO -->
<section class="st-subpage-hero" style="position:relative;overflow:hidden;background:linear-gradient(160deg,#060d1a 0%,#0a1628 50%,#0d1f3c 100%)">
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(0,102,204,0.05) 1px,transparent 1px);background-size:30px 30px;pointer-events:none"></div>
  <div style="position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:600px;height:350px;background:radial-gradient(ellipse,rgba(0,102,204,0.12) 0%,transparent 70%);pointer-events:none"></div>
  <div style="position:relative;z-index:2;max-width:760px;margin:0 auto;padding:0 1.5rem;text-align:center">
    <div class="st-reveal" style="display:inline-flex;align-items:center;gap:8px;background:rgba(0,102,204,0.12);border:1px solid rgba(0,102,204,0.2);border-radius:100px;padding:5px 14px;margin-bottom:18px;backdrop-filter:blur(4px)">
      <svg style="width:14px;height:14px;color:#60a5fa" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      <span style="font-size:0.74rem;font-weight:700;color:#93c5fd;text-transform:uppercase;letter-spacing:0.08em">Secure Techies, LLC</span>
    </div>
    <h1 class="st-reveal" style="font-size:clamp(2rem,4.5vw,2.8rem);font-weight:800;color:#f1f5f9;line-height:1.12;letter-spacing:-0.03em;margin-bottom:0;transition-delay:.05s">{{ .Title }}</h1>
  </div>
</section>

<!-- PAGE CONTENT -->
<section style="background:#fff;padding:56px 0 72px">
  <div style="max-width:800px;margin:0 auto;padding:0 1.5rem">
    <div class="st-legal-content st-reveal">
      {{ .Content }}
    </div>
  </div>
</section>

<style>
  .st-legal-content { font-size:1.02rem;color:#374151;line-height:1.85; }
  .st-legal-content h2 { font-size:1.45rem;font-weight:800;color:#0f172a;margin:40px 0 14px;letter-spacing:-0.02em; }
  .st-legal-content h3 { font-size:1.2rem;font-weight:700;color:#0f172a;margin:32px 0 10px; }
  .st-legal-content h4 { font-size:1.05rem;font-weight:700;color:#0f172a;margin:28px 0 8px; }
  .st-legal-content p { margin-bottom:18px; }
  .st-legal-content ul, .st-legal-content ol { padding-left:0;list-style:none;margin-bottom:24px; }
  .st-legal-content ul li { position:relative;padding:6px 0 6px 28px;color:#475569; }
  .st-legal-content ul li::before { content:"";position:absolute;left:2px;top:14px;width:8px;height:8px;background:#0066CC;border-radius:50%; }
  .st-legal-content ol { counter-reset:item;padding-left:0; }
  .st-legal-content ol li { position:relative;padding:6px 0 6px 36px;color:#475569;counter-increment:item; }
  .st-legal-content ol li::before { content:counter(item);position:absolute;left:0;top:5px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:#f0f6ff;border:1px solid #dbeafe;color:#0066CC;font-size:0.78rem;font-weight:700;border-radius:7px; }
  .st-legal-content a { color:#0066CC;font-weight:600;text-decoration:none; }
  .st-legal-content a:hover { text-decoration:underline; }
  .st-legal-content strong { color:#0f172a; }
  .st-legal-content hr { border:none;border-top:1px solid #e2e8f0;margin:32px 0; }
</style>

<script>
(function(){
  var reveals = document.querySelectorAll('.st-reveal,.st-reveal-right');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('st-visible'); io.unobserve(e.target); } });
    },{threshold:0.12});
    reveals.forEach(function(el){ io.observe(el); });
  } else { reveals.forEach(function(el){ el.classList.add('st-visible'); }); }
})();
</script>

{{ end }}
