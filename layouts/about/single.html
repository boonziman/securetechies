{{ define "main" }}
{{/* Founder / child about pages — same visual language as company About */}}
<section class="st-subpage-hero" style="position:relative;overflow:hidden;background:linear-gradient(160deg,#060d1a 0%,#0a1628 50%,#0d1f3c 100%)">
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(0,102,204,0.05) 1px,transparent 1px);background-size:30px 30px;pointer-events:none"></div>
  <div style="position:relative;z-index:2;max-width:760px;margin:0 auto;padding:0 1.5rem;text-align:center">
    <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(0,102,204,0.12);border:1px solid rgba(0,102,204,0.2);border-radius:100px;padding:6px 16px 6px 8px;margin-bottom:20px">
      <span style="font-size:0.78rem;font-weight:700;color:#93c5fd;text-transform:uppercase;letter-spacing:0.08em">About Us</span>
    </div>
    <h1 style="font-size:clamp(2rem,4.5vw,2.9rem);font-weight:800;color:#f1f5f9;line-height:1.15;letter-spacing:-0.03em;margin-bottom:16px">{{ .Title }}</h1>
    {{ with .Params.description }}<p style="font-size:1.05rem;color:#94a3b8;line-height:1.7;max-width:560px;margin:0 auto">{{ . }}</p>{{ end }}
  </div>
</section>

<section style="background:#fff;padding:64px 0 80px">
  <div style="max-width:760px;margin:0 auto;padding:0 1.5rem">
    <nav style="font-size:0.88rem;color:#64748b;margin-bottom:28px">
      <a href="{{ "about/" | relURL }}" style="color:#0066CC;font-weight:600;text-decoration:none">About Us</a>
      <span style="margin:0 8px;opacity:0.5">/</span>
      <span style="color:#0f172a;font-weight:600">{{ .Title }}</span>
    </nav>
    <article class="st-about-prose" style="font-size:1.05rem;color:#475569;line-height:1.85">
      {{ .Content }}
    </article>
    <div style="margin-top:40px;display:flex;flex-wrap:wrap;gap:12px">
      <a href="{{ "about/" | relURL }}" style="display:inline-flex;align-items:center;gap:8px;border:1px solid #e2e8f0;color:#0f172a;font-weight:700;padding:12px 20px;border-radius:10px;text-decoration:none">← Back to About Us</a>
      <a href="{{ "contact/" | relURL }}" style="display:inline-flex;align-items:center;gap:8px;background:#0066CC;color:#fff;font-weight:700;padding:12px 20px;border-radius:10px;text-decoration:none">Contact the team</a>
    </div>
  </div>
</section>

<style>
.st-about-prose h2{font-size:1.45rem;font-weight:800;color:#0f172a;letter-spacing:-0.02em;margin:2rem 0 .85rem;line-height:1.25}
.st-about-prose h2:first-child{margin-top:0}
.st-about-prose p{margin:0 0 1rem}
.st-about-prose a{color:#0066CC;font-weight:600;text-decoration:none}
.st-about-prose a:hover{text-decoration:underline}
.st-about-prose ul{margin:0 0 1.1rem;padding-left:1.2rem}
.st-about-prose li{margin:0 0 .45rem}
</style>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type":"ListItem","position":1,"name":"Home","item":"{{ "" | absURL }}"},
    {"@type":"ListItem","position":2,"name":"About Us","item":"{{ "about/" | absURL }}"},
    {"@type":"ListItem","position":3,"name":{{ .Title | jsonify }},"item":"{{ .Permalink }}"}
  ]
}
</script>
{{ end }}
